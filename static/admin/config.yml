local_backend: true
site_url: https://venushotyoga.hr
display_url: https://venushotyoga.hr
logo_url: /favicon.png
locale: hr
media_folder: assets/images
public_folder: /images
backend:
  name: git-gateway
  branch: main
  squash_merges: true

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: posts
    label: Blog
    label_singular: Članak
    folder: content/hr/posts
    path: "{{slug}}/index"
    create: true
    sortable_fields: [date, title]
    summary: "{{title}} – {{day}}.{{month}}.{{year}}."
    fields:
      - { label: Naslov, name: title, widget: string }
      - { label: Opis, name: description, widget: text }
      - { label: Datum objave, name: date, widget: datetime }
      - { label: Autor, name: author, widget: string, default: Vjerna Nevistić }
      - { label: Vrsta, name: category, widget: select, options: [{ label: Blog, value: blog }, { label: E-knjiga, value: ebook }], default: blog }
      - { label: Naslovna slika, name: featured_image, widget: image }
      - { label: Oznake, name: tags, widget: list, required: false }
      - { label: Ključne riječi, name: keywords, widget: list, required: false }
      - { label: Sadržaj, name: body, widget: markdown }

  - name: schedule
    label: Raspored
    editor:
      preview: false
    files:
      - label: Raspored (HR)
        name: schedule-hr
        file: content/hr/hot-yoga.md
        fields: &schedule_page
          - { label: Draft, name: draft, widget: boolean, default: false }
          - { label: Naslov, name: title, widget: string }
          - { label: Datum, name: date, widget: datetime }
          - { label: Opis, name: description, widget: text, required: false }
          - { label: Slika, name: image, widget: image, required: false }
          - { label: Slug, name: slug, widget: hidden, required: false }
          - label: Raspored
            name: schedule
            widget: list
            summary: "{{fields.day}}"
            fields:
              - label: Dan
                name: day
                widget: select
                options: [Ponedjeljak, Utorak, Srijeda, Četvrtak, Petak, Subota, Nedjelja]
              - label: Termini
                name: appointments
                widget: list
                summary: "{{fields.startTime}}–{{fields.endTime}} {{fields.service}}"
                fields:
                  - { label: Usluga, name: service, widget: string }
                  - { label: Početak, name: startTime, widget: string, pattern: ['^\d{2}:\d{2}$', 'HH:MM'] }
                  - { label: Kraj, name: endTime, widget: string, pattern: ['^\d{2}:\d{2}$', 'HH:MM'] }
                  - { label: Napomena, name: description, widget: string, required: false }
          - { label: Sadržaj (Markdown s Hugo shortcodeovima), name: body, widget: text }
      - label: Raspored (EN)
        name: schedule-en
        file: content/en/hot-yoga.md
        fields: *schedule_page

  - name: pricing
    label: Cijenik
    editor:
      preview: false
    files:
      - label: Cijenik (HR)
        name: pricing-hr
        file: content/hr/pricing.md
        fields: &pricing_page
          - { label: Draft, name: draft, widget: boolean, default: false }
          - { label: Naslov, name: title, widget: string }
          - { label: Datum, name: date, widget: datetime }
          - { label: Opis, name: description, widget: text, required: false }
          - { label: Layout, name: layout, widget: hidden, default: pricing }
          - { label: Slug, name: slug, widget: hidden, required: false }
          - label: Hot Yoga
            name: hotyoga
            widget: list
            collapsed: true
            summary: "{{fields.category}}"
            fields: &price_group
              - { label: Kategorija, name: category, widget: string }
              - label: Cijene
                name: prices
                widget: list
                summary: "{{fields.service}} – {{fields.price}}"
                fields:
                  - { label: Usluga, name: service, widget: string }
                  - { label: Cijena, name: price, widget: string }
                  - { label: Cijena s popustom, name: popust, widget: string, required: false }
          - label: Pomlađivanje (prve dvije kategorije lijevo, ostale desno)
            name: rejuvenation
            widget: list
            collapsed: true
            summary: "{{fields.category}}"
            fields: *price_group
          - { label: Sadržaj, name: body, widget: markdown, required: false }
      - label: Cijenik (EN)
        name: pricing-en
        file: content/en/pricing.md
        fields: *pricing_page

  - name: faq
    label: FAQ
    editor:
      preview: false
    files:
      - label: FAQ (HR)
        name: faq-hr
        file: content/hr/faq.md
        fields: &faq_page
          - { label: Draft, name: draft, widget: boolean, default: false }
          - { label: Naslov, name: title, widget: string }
          - { label: Datum, name: date, widget: datetime }
          - { label: Opis, name: description, widget: text, required: false }
          - { label: Slika, name: image, widget: image, required: false }
          - { label: Layout, name: layout, widget: hidden, default: faq }
          - label: Pitanja
            name: faq
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: Pitanje, name: question, widget: string }
              - { label: Odgovor, name: answer, widget: markdown }
          - { label: Sadržaj, name: body, widget: markdown, required: false }
      - label: FAQ (EN)
        name: faq-en
        file: content/en/faq.md
        fields: *faq_page
