testimonials:
  - name: "Mara Pušec"
    image: "/images/IMG-mara-pusec.jpg"
    testimonial:
      hr: "Ono u čemu mi je yoga pomogla u samom treniranju I utrkivanju je smanjenje grča oko ramena, vrata I gornjeg dijela tijela. To mi se često dešavalo na dugim treninzima nakon 25 km ili u utrci. Yoga mi je pomogla da mi taj dio prodiše. Svakodnevno zapažam benefite yoge, povečala mi se gipkost I lakoća kretanja tj. Trčanja. Spoznala sam I primjenjujem pravilno disanje, pa prodišem teške trenutke na treningu ili utrci. Uglavnom bez yoge ne ide! Ona savršeno nadopunjuje trčanje."
      en: "Where yoga has helped me most in training and racing is easing the tension around my shoulders, neck and upper body. It used to happen often on long runs after 25 km or during a race, and yoga has helped that part of me breathe. I notice the benefits of yoga every day: I have become more flexible and I move, and run, more easily. I have learned to breathe properly and I use it, so I breathe through the hard moments in training or in a race. In short, I can't do without yoga! It complements running perfectly."
  - name: "Anne Feron"
    image: "/images/IMG-anne-feron.jpg"
    testimonial:
      hr: "Kao trkačica tražila sam povećanje fleksibilnosti kad sam počela s yogom, no našla sam puno više. Yoga daje snagu mojim mišićima za bolje trčanje, te snagu I izdržljivost mom umu da izvedem I najteže trke. Puno sam naučila o svom tijelu, kako da pravilno dišem ali isto tako da dam maksimum od sebe u nekoj aktivnosti. Svaki hot yoge je sat  drugačiji i prilagođava se polaznicima. Učiteljica nam objašnjava asane tako da ih izvodimo pravilno i da možemo napredovati i osjećati se ugodno u pozicijama. "
      en: "As a runner I was looking for more flexibility when I started yoga, but I found much more. Yoga gives my muscles the strength to run better, and gives my mind the strength and endurance to get through the toughest races. I have learned a lot about my body, how to breathe properly and also how to give my best in any activity. Every hot yoga class is different and adapts to the people in it. The teacher explains the asanas so that we do them correctly, can make progress and feel comfortable in the poses."
  - name: "Marijana Liszt"
    image: "/images/IMG-marijana-liszt.jpg"
    testimonial:
      hr: "Za mene hot yoga čini savršenu ravnotežu trčanju. Po prirodi nisam fleksibilna, a od trčanja postajem jos tvrđa I skračuju se tetive. Neopisivo mi je važno istezanje koje puno lakše I bolje mogu postići uz hot yogu u grijanoj prostoriji. Obožavam taj osjećaj ugode u pojedinim asanama. Kada redovito vježbam yogu nemam bolova u donjem dijelu leđa što me uz trčanje, a bez yoge, uvijek prati! Takođe sam avansirala I vezano uz disanje. Tehnike disanja koje nas uči Vjerna pomažu mi I u trčanju. Općenito mislim da sam našla svoju dobitnu kombinaciju!"
      en: "For me, hot yoga is the perfect balance to running. I am not naturally flexible, and running makes me even stiffer and shortens my tendons. Stretching matters enormously to me, and I can do it much more easily and better with hot yoga in a heated room. I love that feeling of ease in certain asanas. When I practise yoga regularly I have no lower back pain, which always comes with running when I don't do yoga! I have also made progress with my breathing: the breathing techniques Vjerna teaches us help me when I run as well. All in all, I think I have found my winning combination!"
  - name: "Tihana Škrinjarić"
    image: "/images/IMG-Tihana-škrinjaric.jpg"
    testimonial:
      hr: "Pred nekoliko godina, vježbajući jogu ljeti uz more, shvatila sam koliko mi toplina odgovara te sam pri povratku tražila i našla hot yogu. I to je bilo to.... Puno sam fleksibilnija u toplom prostoru, a znojeći se izbacujem toksine iz tijela, tako da se poslije hot yoge osjećam kao da sam izašla iz saune....lagano, osviježeno i puna energije a i koža mi je ljepša. prokrvljena i izgleda zdravije zbog pojačane cirkulacije. A i što se tiče održavanja tjelesne težine hot yoga puno pomaže.Nedavno se je moj prijatelj vagao prije i poslije joge je imao 3 i pol kile manje...!!!!Da to je voda ali ipak....Vrlo je spretno što u istom prostoru možemo koristiti i LPG aparate za lice i tijelo, koji su vrlo efikasni, a voditeljica Vjerna Nevistić je izvrsna, stručna i topla pedagoginja, koja me svojim nenametljivim načinom potiče da maksimalno uspješno izvodim asane, tako da se i moji problemi ravnoteže i krutosti kralježnice iz dana u dan sve više riješavaju... "
      en: "A few years ago, practising yoga by the sea in summer, I realised how well warmth suits me, so when I came back I looked for hot yoga and found it. And that was it... I am much more flexible in a warm room, and by sweating I flush toxins out of my body, so after hot yoga I feel as if I've just left a sauna: light, refreshed and full of energy, and my skin looks better too, rosier and healthier thanks to the improved circulation. Hot yoga also helps a lot with keeping my weight in check. A friend of mine recently weighed himself before and after yoga and was three and a half kilos lighter! Yes, it's water, but still... It's very handy that the same studio has LPG devices for the face and body, which are very effective. Our teacher Vjerna Nevistić is an excellent, knowledgeable and warm teacher who, in her unobtrusive way, encourages me to do the asanas as well as I can, so my problems with balance and a stiff spine are getting better day by day..."
  - name: "Anja M."
    image: "/images/IMG-anja-m.jpg"
    testimonial:
      hr: "Kada sam prije dva mjeseca krenula na Hot yogu, trebala mi je tjelovježba zbog problema sa kilogramima. Naime prije vježbanja imala sam velik, gotovo nekontrolirani apetit. Počela sam vježbati 3 do 4 puta tjedno i promijenila sam način prehrane a u periodu od mjesec i pol izgubila 11 kilograma. No, osim gubitka kilograma, tijelo mi se učvrstilo, koža mi je meka i glatka, a povrh svega osjećaj gladi je nestao. Hot yoga mi je pomogla uravnotežiti prehranu, općenito se bolje osjećam, kilogrami i centimetri se tope, a nakon tjelovježbe umjesto umora osjećam se poletno i puna energije."
      en: "When I started hot yoga two months ago, I needed exercise because of my weight. Before I started, I had a big, almost uncontrollable appetite. I began practising 3 to 4 times a week, changed the way I eat, and lost 11 kilos in a month and a half. Besides losing weight, my body has become firmer, my skin is soft and smooth, and above all the constant hunger has gone. Hot yoga has helped me balance my diet. I feel better in general, the kilos and centimetres are melting away, and after a workout I feel uplifted and full of energy instead of tired."
  - name: "Tihana M."
    image: "/images/IMG-tihana-m.jpg"
    testimonial:
      hr: "Probala sam više manje sve tipove vježbanja i nekako sam se u jogi našla. Nisam osobit ljubitelj visokih temperatura (dapače, jedina sam u garderobi koja se veseli zimi  :)), ali nakon par početnih treninga skužila sam da mi je samo taj element falio. Na treningu se oznojim kao da sam otrčala maraton, mislim da me čak i nešto od runners high-a šusne u glavu jer se osjećam polublaženo nakon  ;)) Postura tijela u potpunosti mi se promijenila. Ravnoteža, i tijela i uma, polako mi se vraća. Sve sam snažnija. Sad samo čekam dan kad ću uz pomoć trenerica Vjerne i Nikoline dubiti na glavi. U dane 'kad mi se ništa ne da' obavezno odem po dozu pozitive u studio, jer sam sigurna da ću nakon sata i šalice čaj zadovoljna izaći van."
      en: "I have tried more or less every kind of exercise, and somehow I found myself in yoga. I'm not a big fan of high temperatures (in fact, I'm the only one in the changing room who looks forward to winter :)), but after a few classes I realised that this was exactly what I had been missing. In class I sweat as if I had run a marathon, and I think I even get a bit of a runner's high, because afterwards I feel half blissful ;)) My posture has changed completely. My balance, of both body and mind, is slowly coming back. I keep getting stronger. Now I'm just waiting for the day when, with the help of our teachers Vjerna and Nikolina, I'll do a headstand. On days when I don't feel like doing anything, I always go to the studio for a dose of positivity, because I know I'll leave happy after a class and a cup of tea."
  - name: "Ana B."
    image: "/images/IMG-ana-b.jpg"
    testimonial:
      hr: "Imam 30 godina i skoliozu. Radi se o iskrivljenju kralješnice u stranu koje otežava život pogotovo sa povećanjem godina i sa povećanjem stupnja iskrivljenja. Krenula sam na Hot yogu, vođena iskustvima prijateljice koja u Americi vježba hot yogu i tako je popravila svoj problem sa skoliozom. Moram priznati da sam na početku bila skeptična jer ipak sam ja više tip za neku aktivnost kao aerobic, skakanje, udaranje i mislila sam da nema šanse da ću, ja 'živac', izdržati 75 min na 38 stupnja. Ali kako sam se prevarila. Već u samo nekoliko sati (krenula sam 2 puta, a sada sam povećala na 3 puta tjedno) moj stav tijela se poboljšao, više nije bilo boli u donjem dijelu leđa i vratu, stesala sam trbuh i bokove (iako mi to nije bio primaran cilj) i osjećala se ODLIČNO. Stekla sam snagu, ravnotežu i fleksibilnost koju sam već davnih dana izgubila. I puno bolje dišem. Voditeljice koje rade u hot yoga centru fokusirane su, detaljno prate svakog člana prilikom vježbanja kako ne bi došlo do ozljeda ili nepravilnih poza, uvijek su prijateljski raspoložene i otvorene za davanje savjeta što je stvarno bitna mješavina za to kako se osjećate i da li se želite vratiti na sat sa željom ponovnog druženja. Hot Yoga mi je promijenila život i na fizičkom i na psihičkom nivou te je preporučam svakome bilo koje životne dobi."
      en: "I am 30 and I have scoliosis, a sideways curvature of the spine that makes life harder, especially as you get older and the curve increases. I started hot yoga after hearing from a friend in America who practises hot yoga and fixed her own scoliosis that way. I must admit I was sceptical at first, because I'm more the type for aerobics, jumping and punching, and I thought there was no way that I, a bundle of nerves, would last 75 minutes at 38 degrees. But how wrong I was. After just a few classes (I started twice a week and now go three times) my posture improved, the pain in my lower back and neck was gone, my stomach and hips slimmed down (even though that wasn't my main goal) and I felt GREAT. I have regained strength, balance and flexibility I lost long ago, and I breathe much better. The teachers at the hot yoga centre are focused and watch every member closely during practice so there are no injuries or incorrect poses. They are always friendly and happy to give advice, which really matters for how you feel and whether you want to come back to class. Hot yoga has changed my life physically and mentally, and I recommend it to anyone of any age."
