baseURL = 'https://venushotyoga.hr/'
locale = 'hr-HR'
titleCaseStyle = 'firstupper'
title = 'Najbolja yoga Zagreb - ako tražite yoga usluge ili pomlađivanje - Venus hot yoga je mjesto za tebe'
defaultContentLanguage = 'hr'
disableDefaultLanguageRedirect = true
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true
disableKinds = ['taxonomy', 'term']

[services]
  [services.googleAnalytics]
    id = 'G-WV6G3SGDB2'

[privacy]
  [privacy.youTube]
    privacyEnhanced = true

[languages]
  [languages.hr]
    locale = 'hr-HR'
    label = 'Hrvatski'
    contentDir = 'content/hr'
    weight = 1
    [languages.hr.params]
      reading_speed = 180
      flag = 'images/svg/flag-for-croatia.svg'
  [languages.en]
    locale = 'en-US'
    label = 'English'
    contentDir = 'content/en'
    weight = 2
    [languages.en.params]
      reading_speed = 228
      flag = 'images/svg/flag-for-united-states.svg'

[frontmatter]
  date = ['date', 'publishDate', 'pubdate', 'lastmod', 'modified']
  expiryDate = ['expiryDate', 'unpublishdate']
  lastmod = [':git', 'lastmod', 'modified', 'date', 'publishDate', 'pubdate']
  publishDate = ['publishDate', 'pubdate', 'date']

[module]
  [module.hugoVersion]
    min = '0.168.0'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
    disableWatch = true

[build.buildStats]
  enable = true
[[build.cachebusters]]
  source = 'assets/notwatching/hugo_stats\.json'
  target = 'css'
[[build.cachebusters]]
  source = 'layouts/.*'
  target = 'css'

[caches]
  [caches.images]
    dir = ':cacheDir/images'
    maxAge = '4320h'

[imaging]
  resampleFilter = 'CatmullRom'
  anchor = 'Smart'
  [imaging.jpeg]
    quality = 75
  [imaging.webp]
    quality = 75

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true

[security.node.permissions]
  allowAddons = ['tailwindcss']
  allowWorker = ['tailwindcss']
[security.exec]
  allow = ['^git$', '^node$', '^tailwindcss$']
