<section class="not-prose mx-auto my-10 max-w-7xl">
  <div class="grid grid-cols-1 gap-8 overflow-hidden rounded-2xl bg-bright-yellow lg:grid-cols-2 lg:gap-16">
    {{- with .Get "src" }}
    <div class="relative h-96! overflow-hidden rounded-2xl sm:h-full {{ $.Get "class" }}">
      {{ partial "image" (dict "sizes" "(min-width: 1024px) 50vw, 100vw" "src" . "page" $.Page "width" 1000 "alt" ($.Get "alt" | default "") "class" "inset-0 h-full w-full object-cover") }}
    </div>
    {{- end }}
    <div class="p-6 lg:py-8 lg:pe-8">
      <div class="prose prose-lg prose-stone max-w-none prose-headings:text-ink prose-h2:mt-0 prose-h2:font-semibold prose-h2:text-camel-dark sm:p-1">
        {{ .Inner | .Page.RenderString (dict "display" "block") }}
      </div>
    </div>
  </div>
</section>
