<section class="not-prose my-10 overflow-hidden rounded-2xl bg-bright-yellow">
  {{- with .Get "src" }}
  <div class="flex justify-center">
    {{ partial "image" (dict "sizes" "(min-width: 1024px) 52rem, 100vw" "src" . "page" $.Page "width" 1200 "alt" ($.Get "alt" | default "") "class" "h-auto max-h-144 w-auto max-w-full") }}
  </div>
  {{- end }}
  <div class="p-6 sm:p-8">
    <div class="prose prose-lg prose-stone max-w-none prose-headings:text-ink prose-h2:mt-0 prose-h2:font-semibold prose-h2:text-camel-dark">
      {{ .Inner | .Page.RenderString (dict "display" "block") }}
    </div>
  </div>
</section>
