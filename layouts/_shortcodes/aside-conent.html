<section class="not-prose mx-auto my-4 max-w-7xl sm:py-12 lg:py-4">
  <div class="grid grid-cols-1 gap-8 rounded-lg bg-bright-yellow lg:grid-cols-2 lg:gap-16">
    {{- with .Get "src" }}
    <div class="relative h-96! overflow-hidden rounded-lg sm:h-full {{ $.Get "class" }}">
      {{ partial "image" (dict "src" . "page" $.Page "width" 1000 "alt" ($.Get "alt" | default "") "class" "inset-0 h-full w-full object-cover") }}
    </div>
    {{- end }}
    <div class="p-5 lg:py-4">
      <div class="prose space-y-4 text-xl text-gray-600 prose-h2:mt-0 sm:p-1">
        {{ .Inner | .Page.RenderString (dict "display" "block") }}
      </div>
    </div>
  </div>
</section>
