<details data-read-more class="group -mt-3 mb-6">
  <summary class="inline-flex cursor-pointer items-center gap-1 font-medium text-camel-dark underline decoration-camel/40 underline-offset-4 hover:decoration-camel-dark group-open:hidden">{{ T "read_more" }}</summary>
  <div class="rounded-2xl bg-bright-yellow p-6 [&>*:first-child]:mt-0 [&>*:last-child]:mb-0">
    {{ .Inner | .Page.RenderString (dict "display" "block") }}
  </div>
</details>
