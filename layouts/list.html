{{ define "main" }}
<div class="mx-auto max-w-7xl px-4 pb-8 sm:px-6 lg:px-8">
  <h1 class="my-4 text-3xl font-bold text-camel-dark">{{ .Title }}</h1>
  <div class="prose max-w-none">{{ .Content }}</div>
  <ul class="mt-6 space-y-4">
    {{- range .Pages }}
    <li>
      <a class="text-lg font-medium hover:underline" href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time class="block text-sm text-gray-500" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format site.Params.dateFormat }}</time>
    </li>
    {{- end }}
  </ul>
</div>
{{ end }}
