{{- $button := "absolute rounded-full p-2 text-stone-200 transition hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-white" }}
<dialog id="lightbox" aria-label="{{ T "image_viewer" }}" class="fixed inset-0 m-0 size-full max-h-none max-w-none flex-col items-center justify-center overscroll-contain bg-stone-950/95 p-0 text-white backdrop:bg-transparent open:flex">
  <button type="button" data-lightbox-close class="{{ $button }} end-3 top-3 z-10">
    <span class="sr-only">{{ T "close" }}</span>
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <p data-lightbox-count class="absolute start-5 top-5 text-sm text-stone-300 tabular-nums lining-nums"></p>
  <figure class="m-0 flex max-w-full flex-col items-center gap-3 px-4">
    <div data-lightbox-stage class="grid max-w-full overflow-hidden rounded-xl">
      <img data-lightbox-thumb alt="" class="col-start-1 row-start-1 size-full scale-110 object-contain blur-xl">
      <img data-lightbox-full alt="" class="relative col-start-1 row-start-1 size-full object-contain opacity-0 transition-opacity duration-300 data-loaded:opacity-100">
    </div>
    <figcaption data-lightbox-caption class="max-w-prose text-center text-sm text-stone-300"></figcaption>
  </figure>
  <button type="button" data-lightbox-prev class="{{ $button }} start-2 top-1/2 -translate-y-1/2 max-sm:hidden">
    <span class="sr-only">{{ T "previous_image" }}</span>
    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg>
  </button>
  <button type="button" data-lightbox-next class="{{ $button }} end-2 top-1/2 -translate-y-1/2 max-sm:hidden">
    <span class="sr-only">{{ T "next_image" }}</span>
    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/></svg>
  </button>
</dialog>
