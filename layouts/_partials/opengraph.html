{{- $rfc3339 := "2006-01-02T15:04:05Z07:00" }}
<meta property="og:site_name" content="{{ site.Params.orgName }}">
<meta property="og:title" content="{{ .title }}">
<meta property="og:description" content="{{ .description }}">
<meta property="og:url" content="{{ .page.Permalink }}">
<meta property="og:locale" content="{{ replace site.Language.Locale "-" "_" }}">
{{- range .page.Translations }}
<meta property="og:locale:alternate" content="{{ replace .Language.Locale "-" "_" }}">
{{- end }}
{{- if and .page.IsPage (eq .page.Section "posts") }}
<meta property="og:type" content="article">
<meta property="article:published_time" content="{{ .page.PublishDate.Format $rfc3339 }}">
<meta property="article:modified_time" content="{{ .page.Lastmod.Format $rfc3339 }}">
{{- range .page.Params.tags }}
<meta property="article:tag" content="{{ . }}">
{{- end }}
{{- else }}
<meta property="og:type" content="website">
{{- end }}
