{{- with hugo.Data.testimonials.testimonials }}
<section data-slider="testimonials" aria-labelledby="testimonials-heading">
  <div class="mx-auto max-w-335 px-4 py-12 sm:px-6 lg:me-0 lg:py-16 lg:ps-8 lg:pe-0 xl:py-24">
    <div class="max-w-7xl items-end justify-between sm:flex sm:pe-6 lg:pe-8">
      <h2 id="testimonials-heading" class="max-w-xl text-4xl font-bold tracking-tight text-camel sm:text-5xl">{{ T "testimonials" }}…</h2>
      <div class="mt-8 flex gap-4 lg:mt-0">
        <button type="button" data-slider-prev aria-label="{{ T "previous_slide" }}" class="cursor-pointer rounded-full border border-camel p-3 text-camel transition hover:bg-khaki hover:text-white">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5 rtl:rotate-180" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
        </button>
        <button type="button" data-slider-next aria-label="{{ T "next_slide" }}" class="cursor-pointer rounded-full border border-camel p-3 text-camel transition hover:bg-khaki hover:text-white">
          <svg class="h-5 w-5 rtl:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
        </button>
      </div>
    </div>
    <div class="-mx-6 mt-8 lg:col-span-2 lg:mx-0">
      <div data-slider-track class="keen-slider">
        {{- range . }}
        <div class="keen-slider__slide">
          <figure class="flex h-full flex-col justify-between bg-white p-6 shadow-xs sm:p-8 lg:p-12">
            <div class="mt-4 flex items-center gap-4">
              {{ partial "image" (dict "src" .image "width" 192 "ratio" 1.0 "alt" "" "class" "h-24 w-24 rounded-full object-cover") }}
              <p class="text-2xl font-bold text-khaki sm:text-3xl">{{ .name }}</p>
            </div>
            <blockquote class="mt-4 leading-relaxed text-gray-700">
              <p>{{ .testimonial | truncate 550 "…" }}</p>
            </blockquote>
            <figcaption class="mt-4 text-sm font-medium text-gray-700 sm:mt-6">&mdash; {{ .name }}</figcaption>
          </figure>
        </div>
        {{- end }}
      </div>
    </div>
    <div class="mx-auto mb-5 max-w-lg text-center">
      <a href="/facebook" class="inline-block rounded-full bg-ecru px-12 py-3 text-sm font-medium text-white transition hover:bg-khaki focus:ring-3 focus:ring-yellow-400 focus:outline-hidden">{{ T "show_more" }}</a>
    </div>
  </div>
</section>
{{- end }}
