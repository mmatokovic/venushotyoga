    </button>
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2 lg:gap-8">
      {{ partial "image" (dict "src" "images/thumbnail_IMG_8498.jpg" "width" 600 "alt" "" "class" "h-87.5 w-full rounded-xl object-contain") }}
      <div>
        <h2 id="popup-title" class="text-3xl font-medium">HOT Yoga drop in!</h2>
        <p class="mt-4 text-gray-500">Najava potrebna, cijena: 20€</p>
        <p class="text-gray-500">petak u 10:00 i subota u 11:00!</p>
      </div>
    </div>
  </div>
</aside>
