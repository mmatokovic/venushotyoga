{{- $popup := .popup }}
<aside id="popup" data-popup class="fixed inset-x-0 bottom-0 z-50 p-4" aria-labelledby="popup-title" hidden>
  <div class="relative max-w-xl rounded-lg bg-gray-100 p-6 shadow-xs">
    <button type="button" data-popup-close class="absolute -end-1 -top-1 cursor-pointer rounded-full border border-gray-200 bg-white p-1 text-gray-600" aria-label="{{ T "close" }}">
      <svg xmlns="http://www.w3.org/2000/svg" class="size-3" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
    </button>
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2 lg:gap-8">
      {{- with $popup.image }}
      {{ partial "image" (dict "src" . "width" 600 "alt" "" "class" "h-87.5 w-full rounded-xl object-contain") }}
      {{- end }}
      <div>
        <h2 id="popup-title" class="text-3xl font-medium">{{ $popup.title }}</h2>
        <div class="mt-4 space-y-1 text-gray-600">{{ $popup.text | .page.RenderString (dict "display" "block") }}</div>
      </div>
    </div>
  </div>
</aside>
