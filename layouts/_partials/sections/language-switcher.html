{{- with .Translations }}
<nav aria-label="{{ T "language" }}">
  <ul class="flex items-center gap-2">
    {{- range . }}
      {{- $label := .Language.Label }}
    <li>
      <a href="{{ .RelPermalink }}" hreflang="{{ .Language.Locale }}" lang="{{ .Language.Locale }}" class="block py-2.5 text-sm text-gray-700 transition hover:text-gray-700/75" title="{{ $label }}">
        {{- with .Language.Params.flag | resources.Get }}
        <img src="{{ .RelPermalink }}" width="24" height="24" alt="{{ $label }}">
        {{- else }}{{ $label }}{{ end }}
      </a>
    </li>
    {{- end }}
  </ul>
</nav>
{{- end }}
