<table class="min-w-full bg-white">
  <caption class="px-4 py-3 font-bold">{{ .caption }}</caption>
  {{- range .groups }}
  <tbody>
    {{- if and $.showCategory .category }}
    <tr class="font-medium">
      <th colspan="2" scope="colgroup" class="px-4 pt-3 text-start">{{ .category }}</th>
    </tr>
    {{- end }}
    {{- range $i, $p := .prices }}
    <tr class="{{ if modBool $i 2 }}bg-cosmic-latte{{ else }}bg-white{{ end }} text-start font-bold">
      <th scope="row" class="px-4 py-3 text-start font-bold">{{ $p.service }}</th>
      <td class="px-4 py-3 whitespace-nowrap text-amber-700">
        {{- with $p.popust }}<del>{{ $p.price }}</del> {{ . }}{{ else }}{{ $p.price }}{{ end -}}
      </td>
    </tr>
    {{- end }}
  </tbody>
  {{- end }}
</table>
