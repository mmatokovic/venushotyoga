<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head" . }}
</head>
<body class="bg-white text-gray-900 antialiased">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:start-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-white focus:px-4 focus:py-2 focus:shadow-lg">{{ T "skip_to_content" }}</a>
  {{ partial "header" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer" . }}
  {{ partial "consent-banner" . }}
</body>
</html>
