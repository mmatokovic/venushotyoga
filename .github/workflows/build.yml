name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Hugo
        run: |
          HUGO_VERSION=$(sed -n 's/^ *HUGO_VERSION = "\(.*\)"/\1/p' netlify.toml)
          curl -sSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Build (fails on any warning, e.g. a broken internal link)
        run: hugo --gc --minify --panicOnWarning

      - name: Check the Decap CMS config is valid YAML
        run: pnpm dlx yaml@2 valid < static/admin/config.yml

      - name: Check no template value was blocked as unsafe (ZgotmplZ)
        run: "! grep -rl ZgotmplZ public"
