baseURL = 'https://venushotyoga.hr/'
locale = 'hr-HR'
titleCaseStyle = 'firstupper'
title = 'Venus Hot Yoga'
defaultContentLanguage = 'hr'
disableDefaultLanguageRedirect = true
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true
disableKinds = ['taxonomy', 'term']

[services]
  [services.googleAnalytics]
    id = 'G-WV6G3SGDB2'

[privacy]
  [privacy.youTube]
    privacyEnhanced = true

[params]
  orgName = 'Venus Hot Yoga'
  description = 'Hot yoga je idealan način vježbanja za postizanje idealne tjelesne težine i oblika tijela, neovisno o tome da li ste početnik ili iskusan yogi. Na jednom satu hot yoge potroši se od 500 – 1000 kcal (ovisno o tome koliko se trudite). Temperatura od 33 stupnjeva C približna je fiziološkoj temperaturi našeg tijela pa se lakše i dublje mogu izvesti asane, a mogućnost ozljeda smanjena je na minimum. Nakon sata osjećati ćete se puni energije, opušteni, lagani i poletni.'
  logo = 'images/svg/logo-crop.png'
  favicon = 'images/favicon.png'
  shareImage = 'images/homepage.webp'
  dateFormat = '02. 01. 2006.'
  [params.author]
    name = 'Vjerna Nevistić'
  [params.credit]
    name = 'Mislav Matoković'
    url = 'https://github.com/mmatokovic'

[languages]
  [languages.hr]
    locale = 'hr-HR'
    label = 'Hrvatski'
    contentDir = 'content/hr'
    weight = 1
    [languages.hr.params]
      reading_speed = 180
      homeTitle = 'Venus Hot Yoga – hot yoga i pomlađivanje u Zagrebu'
      flag = 'images/svg/flag-for-croatia.svg'
